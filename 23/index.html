<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omdirigering - Fem Matteuppgifter</title>
    
    <!-- UPPDATERING: Ändrat från 0 till 4 sekunder omdirigering -->
    <!-- Meta refresh omdirigering - fungerar även om JavaScript är avstängt -->
    <!-- Omdirigerar efter 4 sekunder -->
    <meta http-equiv="refresh" content="4; url=https://kentlundgren.github.io/AI/Matematik/fem_matteuppgifter.html">
    
    <style>
        /* UPPDATERING: Ny design med klickbar bild och text */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            max-width: 600px;
        }
        
        /* UPPDATERING: Ny stil för klickbar bild */
        .image-container {
            cursor: pointer;
            transition: transform 0.3s ease, opacity 0.3s ease;
            margin: 1rem 0;
        }
        
        .image-container:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        
        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            margin: 0 0 1rem 0;
            font-size: 1.5rem;
        }
        
        .redirect-text {
            margin: 1rem 0;
            font-size: 1.1rem;
        }
        
        .url-link {
            color: #fff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 5px;
            display: inline-block;
            margin-top: 0.5rem;
            transition: background 0.3s ease;
        }
        
        .url-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .click-hint {
            font-size: 0.9rem;
            margin-top: 1rem;
            opacity: 0.8;
        }
        
        /* UPPDATERING: Nedräkningstimer */
        .countdown {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Matematikuppgifter</h1>
        
        <!-- UPPDATERING: Klickbar bild som omdirigerar direkt vid klick -->
        <div class="image-container" onclick="redirectNow()">
            <img src="matematid.jpg" alt="Matematik">
        </div>
        
        <!-- UPPDATERING: Ny text och URL-visning -->
        <p class="redirect-text">Du kommer omdirigeras till:</p>
        <a href="https://kentlundgren.github.io/AI/Matematik/fem_matteuppgifter.html" class="url-link">
            https://kentlundgren.github.io/AI/Matematik/fem_matteuppgifter.html
        </a>
        
        <!-- UPPDATERING: Nedräkning som visar när omdirigering sker -->
        <p class="countdown">Omdirigering om <span id="timer">4</span> sekunder...</p>
        
        <p class="click-hint">💡 Klicka på bilden för att omdirigera direkt</p>
    </div>

    <script>
        // UPPDATERING: Ny funktionalitet med 4 sekunders fördröjning och nedräkning
        
        const targetUrl = 'https://kentlundgren.github.io/AI/Matematik/fem_matteuppgifter.html';
        let timeLeft = 4;
        
        // Funktion för direkt omdirigering vid klick på bild
        function redirectNow() {
            window.location.href = targetUrl;
        }
        
        // Nedräkningstimer som uppdateras varje sekund
        const timerElement = document.getElementById('timer');
        
        const countdown = setInterval(function() {
            timeLeft--;
            if (timeLeft > 0) {
                timerElement.textContent = timeLeft;
            } else {
                clearInterval(countdown);
            }
        }, 1000);
        
        // Automatisk omdirigering efter 4 sekunder
        setTimeout(function() {
            window.location.href = targetUrl;
        }, 4000);
    </script>
</body>
</html>
