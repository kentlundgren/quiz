    <style>
        /* Enkel styling för laddningssidan */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;

        }
        
        .redirect-message {
            text-align: center;
            padding: 2rem;

            border-radius: 8px;

        .redirect-message a {

        }

        }

        <h1>Omdirigerar...</h1>

    </div>

    <script>
        // JavaScript-baserad omdirigering som backup
        // Detta körs omedelbart när sidan laddas
        window.location.href = 'https://kentlundgren.se/program/quiz/0/';
    </script>
</body>
</html>
